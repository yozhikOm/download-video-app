name: pr-title

# A PR into develop lands by squash, so its title becomes the commit
# release-please reads; it must pass commitlint like any commit.
on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
